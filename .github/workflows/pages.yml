name: pages

# Publishes this folder as the Keyflow product site on GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check generated pages
        run: |
          python3 tools/build.py --check
          python3 tools/check_site.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html gallery.html guide.html download.html style.css site.js stardust.js favicon.svg CNAME robots.txt sitemap.xml _site/
          cp -r features i18n previews media _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
